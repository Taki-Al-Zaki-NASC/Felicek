name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Verify formatting
        working-directory: app
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Test
        working-directory: app
        run: flutter test

      # Compiles without Firebase config to prove a fresh clone still builds
      # (the Google Services Gradle plugin is applied conditionally).
      - name: Build debug APK
        working-directory: app
        run: flutter build apk --debug
