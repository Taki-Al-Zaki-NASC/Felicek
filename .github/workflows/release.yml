name: Release APK

# Builds a signed release APK, verifies it, publishes a GitHub Release, and
# rewrites website/update.json so every installed copy of the app picks the
# update up automatically (see docs/UPDATER.md).
#
# Trigger by pushing a tag: `git tag v1.2.0 && git push origin v1.2.0`.
# The tag must match the version in app/pubspec.yaml.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      rolloutPercent:
        description: "Staged rollout percentage (1-100)"
        required: false
        default: "100"
      mandatory:
        description: "Force this update (blocks the app until installed)"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve version from pubspec
        id: version
        working-directory: app
        run: |
          set -euo pipefail
          RAW=$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}')
          NAME="${RAW%%+*}"
          CODE="${RAW##*+}"
          if [ -z "$NAME" ] || [ -z "$CODE" ] || [ "$NAME" = "$CODE" ]; then
            echo "::error::pubspec version must be <semver>+<versionCode>, got '$RAW'"
            exit 1
          fi
          # A tag push must agree with pubspec, or the manifest would advertise
          # a version the binary doesn't actually report.
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$NAME" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match pubspec version v$NAME"
            exit 1
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Restore Firebase config
        working-directory: app/android/app
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "${GOOGLE_SERVICES_JSON:-}" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json
            echo "google-services.json restored"
          else
            echo "::warning::GOOGLE_SERVICES_JSON secret not set — the build will rely on --dart-define Firebase values."
          fi

      - name: Restore signing keystore
        working-directory: app/android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::KEYSTORE_BASE64 is not set. A release signed with the debug key cannot update existing installs — Android rejects an update signed by a different key."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > felicek-release.jks
          cat > key.properties <<EOF
          storePassword=${KEYSTORE_PASSWORD}
          keyPassword=${KEY_PASSWORD}
          keyAlias=${KEY_ALIAS}
          storeFile=${GITHUB_WORKSPACE}/app/android/felicek-release.jks
          EOF

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Test
        working-directory: app
        run: flutter test

      - name: Build release APK
        working-directory: app
        env:
          SITE: ${{ vars.FELICEK_SITE || 'https://felicek.app' }}
          CHECKOUT: ${{ vars.FELICEK_PAYMENT_CHECKOUT_URL || 'https://pay.felicek.app/checkout' }}
        run: |
          flutter build apk --release \
            --dart-define=FELICEK_SITE="$SITE" \
            --dart-define=FELICEK_UPDATE_MANIFEST="$SITE/update.json" \
            --dart-define=FELICEK_PAYMENT_CHECKOUT_URL="$CHECKOUT"

      - name: Stage artifact and checksum
        id: artifact
        run: |
          set -euo pipefail
          NAME="${{ steps.version.outputs.name }}"
          SRC=app/build/app/outputs/flutter-apk/app-release.apk
          OUT="felicek-${NAME}.apk"
          cp "$SRC" "$OUT"
          SHA=$(sha256sum "$OUT" | awk '{print $1}')
          SIZE=$(stat -c%s "$OUT")
          echo "path=$OUT"   >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE"  >> "$GITHUB_OUTPUT"
          echo "APK $OUT — $SIZE bytes — sha256 $SHA"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: Felicek ${{ steps.version.outputs.name }}
          files: ${{ steps.artifact.outputs.path }}
          generate_release_notes: true

      - name: Update release manifest
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          SHA256: ${{ steps.artifact.outputs.sha256 }}
          SIZE: ${{ steps.artifact.outputs.size }}
          ROLLOUT: ${{ github.event.inputs.rolloutPercent || '100' }}
          MANDATORY: ${{ github.event.inputs.mandatory || 'false' }}
        run: |
          set -euo pipefail
          export APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION_NAME}/felicek-${VERSION_NAME}.apk"
          python3 - <<'PY'
          import json, os, datetime
          prev = {}
          try:
              with open('website/update.json') as fh:
                  prev = json.load(fh)
          except (OSError, ValueError):
              pass

          new_code = int(os.environ['VERSION_CODE'])
          old_code = int(prev.get('versionCode', 0) or 0)
          if new_code <= old_code:
              raise SystemExit(
                  f'versionCode must increase: {new_code} <= {old_code}. '
                  'Bump the build number after the "+" in app/pubspec.yaml.'
              )

          manifest = {
              '_comment': prev.get('_comment', 'Release manifest polled by the in-app updater.'),
              'versionCode': new_code,
              'versionName': os.environ['VERSION_NAME'],
              'apkUrl': os.environ['APK_URL'],
              'sha256': os.environ['SHA256'],
              'sizeBytes': int(os.environ['SIZE']),
              'releaseNotes': prev.get('releaseNotes', ''),
              'mandatory': os.environ['MANDATORY'].lower() == 'true',
              'minSupportedVersionCode': int(prev.get('minSupportedVersionCode', 0) or 0),
              'rolloutPercent': int(os.environ['ROLLOUT']),
              'publishedAt': datetime.datetime.now(datetime.timezone.utc)
                               .isoformat().replace('+00:00', 'Z'),
          }
          with open('website/update.json', 'w') as fh:
              json.dump(manifest, fh, indent=2)
              fh.write('\n')
          print(json.dumps(manifest, indent=2))
          PY

      - name: Commit manifest
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add website/update.json
          if git diff --cached --quiet; then
            echo "manifest unchanged"
          else
            git commit -m "chore(release): publish ${{ steps.version.outputs.name }} manifest"
            git push origin HEAD:${{ github.event.repository.default_branch }}
          fi

      - name: Deploy website to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./website
          # GitHub Pages serves update.json and the download page; the APK
          # itself lives on GitHub Releases, which has no bandwidth cap.
