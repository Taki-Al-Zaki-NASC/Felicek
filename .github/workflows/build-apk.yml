name: Build APK

# Produces an installable APK on demand and publishes it to a rolling
# "dev-build" prerelease, so there is always a stable download URL without
# having to cut a tagged release.
#
# Unlike release.yml this requires NO secrets: with GOOGLE_SERVICES_JSON set
# the build is fully functional, and without it the app still installs and
# runs — it just shows its "Firebase is not configured" screen at launch.
# That way a usable artifact exists before the Firebase project does.

on:
  workflow_dispatch:
    inputs:
      buildType:
        description: "Build type"
        required: false
        default: "release"
        type: choice
        options: [release, debug]
      publish:
        description: "Attach the APK to the rolling dev-build prerelease"
        required: false
        default: true
        type: boolean
  push:
    branches:
      - "claude/**"
    paths:
      - "app/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

concurrency:
  # Keyed by commit, not just by branch. Grouping on the branch alone means any
  # run on this ref cancels any other — including a re-run of an OLD commit
  # killing a live build of a newer one, which is exactly what happened when a
  # retry of a known-broken commit cancelled a healthy build eight minutes in.
  # Per-commit grouping still collapses duplicate runs of the same SHA (a push
  # plus a manual dispatch) while letting different commits build independently.
  group: build-apk-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      # Whether to attach the APK to the dev-build prerelease.
      #
      # This cannot be written as `inputs.publish != false` on the step: for a
      # push event `inputs.publish` is empty, and GitHub coerces both '' and
      # false to 0 when comparing, so the condition reads false and the publish
      # silently skips — which is exactly what happened on the first green
      # build. Gate on the event instead: pushes always publish, and a manual
      # dispatch honours its checkbox.
      PUBLISH: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show toolchain
        run: |
          flutter --version
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"

      - name: Restore Firebase config (optional)
        id: firebase
        working-directory: app/android/app
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          # The secret wins when present, so a fork or a second project can
          # override the committed config without editing the repo.
          if [ -n "${GOOGLE_SERVICES_JSON:-}" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Firebase config restored from the GOOGLE_SERVICES_JSON secret."
          elif [ -s google-services.json ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Using the google-services.json committed in the repository."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No Firebase config. The APK will build and install, but the app will open to its 'Firebase is not configured' screen. See docs/SETUP.md."
          fi

          # The Google Services plugin fails the build when the applicationId
          # has no matching client, and the error it prints is easy to misread.
          # Say it plainly instead.
          if [ -s google-services.json ]; then
            WANT=$(grep -m1 'applicationId' build.gradle.kts | cut -d'"' -f2)
            if ! grep -q "\"package_name\": \"${WANT}\"" google-services.json; then
              echo "::error::google-services.json has no client for applicationId '${WANT}'. Register that package in the Firebase console, or fix applicationId in app/android/app/build.gradle.kts."
              exit 1
            fi
            echo "Firebase client matches applicationId ${WANT}."
          fi

      - name: Restore signing key (optional)
        id: signing
        working-directory: app/android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > felicek-release.jks
            cat > key.properties <<EOF
          storePassword=${KEYSTORE_PASSWORD}
          keyPassword=${KEY_PASSWORD}
          keyAlias=${KEY_ALIAS}
          storeFile=${GITHUB_WORKSPACE}/app/android/felicek-release.jks
          EOF
            echo "signed=release" >> "$GITHUB_OUTPUT"
          else
            echo "signed=debug" >> "$GITHUB_OUTPUT"
            echo "::warning::No KEYSTORE_BASE64 secret — falling back to the debug signing key. Installable for testing, but it can never update an install signed with a different key. Use release.yml with real secrets for anything you publish."
          fi

      - name: Dependencies
        working-directory: app
        run: flutter pub get

      - name: Validate platform resources
        run: |
          # flutter analyze reads Dart only, so a malformed Android resource
          # otherwise surfaces four minutes into Gradle. Python's parser
          # enforces the same XML rules aapt2 does — including the one that
          # bit us: "--" is not permitted inside a comment.
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          bad = 0
          files = [f for p in ('app/android/**/*.xml', 'app/ios/**/*.xml',
                               'app/macos/**/*.xml')
                     for f in glob.glob(p, recursive=True) if '/build/' not in f]
          for f in files:
              try:
                  ET.parse(f)
              except ET.ParseError as e:
                  print(f'::error file={f}::{e}')
                  bad += 1
          print(f'{len(files)} XML resources parsed, {bad} malformed')
          sys.exit(1 if bad else 0)
          PY

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Test
        working-directory: app
        run: flutter test

      - name: Read version
        id: version
        working-directory: app
        run: |
          set -euo pipefail
          RAW=$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}')
          echo "name=${RAW%%+*}" >> "$GITHUB_OUTPUT"
          echo "code=${RAW##*+}" >> "$GITHUB_OUTPUT"

      - name: Build APK
        working-directory: app
        env:
          BUILD_TYPE: ${{ inputs.buildType || 'release' }}
          SITE: ${{ vars.FELICEK_SITE || 'https://felicek.app' }}
          CHECKOUT: ${{ vars.FELICEK_PAYMENT_CHECKOUT_URL || 'https://pay.felicek.app/checkout' }}
        run: |
          set -euo pipefail
          flutter build apk --"$BUILD_TYPE" \
            --dart-define=FELICEK_SITE="$SITE" \
            --dart-define=FELICEK_UPDATE_MANIFEST="$SITE/update.json" \
            --dart-define=FELICEK_PAYMENT_CHECKOUT_URL="$CHECKOUT"

      - name: Stage artifact
        id: artifact
        env:
          BUILD_TYPE: ${{ inputs.buildType || 'release' }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          SRC="app/build/app/outputs/flutter-apk/app-${BUILD_TYPE}.apk"
          OUT="felicek-${VERSION}-${BUILD_TYPE}.apk"
          cp "$SRC" "$OUT"
          SHA=$(sha256sum "$OUT" | awk '{print $1}')
          SIZE=$(stat -c%s "$OUT")
          {
            echo "path=$OUT"
            echo "sha256=$SHA"
            echo "size=$SIZE"
            echo "mb=$(awk "BEGIN{printf \"%.1f\", $SIZE/1048576}")"
          } >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: felicek-apk
          path: ${{ steps.artifact.outputs.path }}
          retention-days: 30
          if-no-files-found: error

      - name: Publish to the rolling dev-build prerelease
        if: env.PUBLISH == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-build
          name: Felicek dev build
          prerelease: true
          # Rewritten on every run, so the download link never goes stale.
          body: |
            Latest development build of Felicek — **not a tagged release**.

            | | |
            |---|---|
            | Version | `${{ steps.version.outputs.name }}` (versionCode `${{ steps.version.outputs.code }}`) |
            | Build type | `${{ inputs.buildType || 'release' }}` |
            | Signing | `${{ steps.signing.outputs.signed }}` key |
            | Firebase | ${{ steps.firebase.outputs.configured == 'true' && 'configured' || '**not configured** — see below' }} |
            | Size | ${{ steps.artifact.outputs.mb }} MB |
            | Commit | `${{ github.sha }}` |

            **SHA-256**
            ```
            ${{ steps.artifact.outputs.sha256 }}
            ```

            ### Installing

            1. Download the `.apk` below on your Android phone.
            2. Android will ask you to allow installs from your browser — that
               prompt appears because this is distributed outside the Play
               Store, which is expected here.
            3. Open it.

            ### Before it can talk to a backend

            ${{ steps.firebase.outputs.configured == 'true' && 'This build has Firebase configured and will work against your project.' || 'This build has **no Firebase config**, so it opens to a "Firebase is not configured" screen. Add a `GOOGLE_SERVICES_JSON` repository secret (contents of `app/android/app/google-services.json`) and re-run this workflow, or run `./scripts/setup_firebase.sh` locally. See `docs/SETUP.md`.' }}

            ${{ steps.signing.outputs.signed == 'debug' && '> **Debug-signed.** Fine for testing, but Android will refuse to update it from a release-signed build later — uninstall first when you switch. For anything you publish, set the signing secrets and use the `Release APK` workflow (`docs/RELEASE.md`).' || '' }}
          files: ${{ steps.artifact.outputs.path }}

      - name: Summary
        run: |
          {
            echo "## APK built"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| File | \`${{ steps.artifact.outputs.path }}\` |"
            echo "| Size | ${{ steps.artifact.outputs.mb }} MB |"
            echo "| Signing | ${{ steps.signing.outputs.signed }} key |"
            echo "| Firebase | ${{ steps.firebase.outputs.configured == 'true' && 'configured' || 'NOT configured' }} |"
            echo
            echo "**SHA-256:** \`${{ steps.artifact.outputs.sha256 }}\`"
            echo
            echo "Download: the **felicek-apk** artifact above${{ env.PUBLISH == 'true' && format(', or the [dev-build prerelease]({0}/{1}/releases/tag/dev-build) — no login needed', github.server_url, github.repository) || ' (publishing to the dev-build release was disabled for this run)' }}."
          } >> "$GITHUB_STEP_SUMMARY"
