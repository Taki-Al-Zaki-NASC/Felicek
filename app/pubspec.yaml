name: felicek
description: >-
  Felicek — verified freelance marketplace with escrow, live skill challenges
  and real-time messaging. Android client.
publish_to: "none"

# version: <semver>+<androidVersionCode>
# The build number (after `+`) is the Android versionCode and MUST increase on
# every release — the in-app updater compares it against update.json.
version: 1.0.0+12

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # --- Firebase (Spark / free tier only: Auth + Firestore) ---
  firebase_core: ^4.1.1
  # Free on the Spark plan — crash reporting needs no billing upgrade.
  firebase_crashlytics: ^5.0.2
  firebase_auth: ^6.1.0
  cloud_firestore: ^6.0.2

  # --- State ---
  provider: ^6.1.2

  # --- Platform / storage ---
  shared_preferences: ^2.3.3
  path_provider: ^2.1.5
  package_info_plus: ^8.1.2

  # --- Self-hosted APK auto-update ---
  http: ^1.2.2
  crypto: ^3.0.6

  # --- Real-time audio/video calls (WebRTC, free STUN) ---
  flutter_webrtc: ^1.4.0
  permission_handler: ^12.0.0+1

  # --- Profile photos ---
  image_picker: ^1.1.2
  image: ^4.3.0

  # --- External payment gateway hand-off ---
  url_launcher: ^6.3.1

  # --- Misc ---
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

dependency_overrides:
  # jni is pulled in transitively (path_provider_android → jni_flutter → jni).
  #
  # 1.0.1 is RETRACTED on pub.dev and breaks every Android release build under
  # AGP 9: its android/build.gradle only applies `kotlin-android` when the AGP
  # major is < 9, but then calls `kotlin { compilerOptions { … } }`
  # unconditionally, so Gradle fails with "Could not find method kotlin()".
  # 1.0.0 has no Kotlin block at all and is currently the latest published
  # version, so pinning it is a downgrade in name only.
  #
  # This override is needed rather than just re-resolving because pub keeps a
  # retracted version that is already in pubspec.lock.
  #
  # Remove it once a jni > 1.0.1 is published — nothing else depends on it.
  jni: 1.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/

  fonts:
    # Body / UI typeface used across the whole product.
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSans-Bold.ttf
          weight: 700
    # Editorial serif used for the wordmark, job titles and screen titles.
    - family: Newsreader
      fonts:
        - asset: assets/fonts/Newsreader-Medium.ttf
          weight: 500
        - asset: assets/fonts/Newsreader-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Newsreader-Bold.ttf
          weight: 700
